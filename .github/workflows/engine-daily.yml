# Hoshlab — the daily engine run (design.md §3.1; review M16, N16, N17; plan D19).
# CEO (Mondays) → HR (1st of the month, reviewing the previous month) → Strategist → Writer → Designer → QA → Analyst (Sundays, or inputs.agents=analyst) on the runner; the engine itself commits the state as
# hoshlab-bot, pushes the media branch first and then main (rebase-retry), and writes `changed` to
# $GITHUB_OUTPUT; the deploy job then calls pages.yml so the site shows the new state in the same run.
# Shares the `hoshlab-state` concurrency group with publisher-hourly.yml: the two never write state at once.
# The cron sits off the top of the hour on purpose: GitHub documents that scheduled runs are delayed and, under high load,
# dropped, and that load peaks at the start of every hour — the 00:00 UTC cron fired 3 h late on 2026-10-12. Moved 2026-10-12.
# Engine: Daily 05:53 IST (cron 23 0 * * *) · Publisher: Hourly at :47 IST (cron 17 * * * *) · GitHub may delay or skip scheduled runs; a due slot posts at the next run that fires
name: Hoshlab engine (daily)

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents to run, comma-separated (ceo,hr,strategist,writer,designer,qa,analyst); empty = all. The admin's Run analyst button sends `analyst`; `hr` reviews only when due (the 1st, or a missing proposal)"
        type: string
        default: ""
      page:
        description: "Only this page handle (rishtapatra, kaatdo, job_rez); empty = every page"
        type: string
        default: ""
      dry_run:
        description: "Dry run on a temp copy: nothing committed, no deploy"
        type: boolean
        default: false
      mock_llm:
        description: "MOCK_LLM=1: answer every model call from tests/fixtures/llm (no provider key spent)"
        type: boolean
        default: false
      render_sample:
        description: "Render the fixture samples (one image + one kinetic reel per page) into the media branch and deploy; the daily agents do not run (plan D19, FEAT-201)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: hoshlab-state
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.engine.outputs.changed || steps.samples.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: media
        uses: actions/checkout@v7
        with:
          ref: media
          path: .media
        continue-on-error: true
      # M16: the engine never creates branches. A failed checkout of a not-yet-existing `media` branch leaves
      # an initialised but empty .media/.git behind; remove it so the Designer records
      # `skipped: media_branch_missing` instead of committing into an unborn branch.
      - name: Media branch check (M16)
        run: |
          if [ "${{ steps.media.outcome }}" != "success" ] || ! git -C .media rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "media branch not checked out (not configured yet: run scripts/init-media-branch.ps1 once) — the Designer will skip"
            rm -rf .media
          else
            echo "media branch at $(git -C .media rev-parse --short HEAD)"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:fonts
      - name: Install ffmpeg (reels; the ubuntu-24.04 runner image no longer ships it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Bot identity (N16)
        run: |
          git config user.name hoshlab-bot
          git config user.email hoshlab-bot@users.noreply.github.com
      - name: Check the free Gemini model ladder
        if: ${{ inputs.render_sample != true && inputs.mock_llm != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node engine/index.js check-models
      # render_sample=true (plan D19, FEAT-201): the live proof without owner keys — one fixture image and one
      # kinetic reel per page land on the media branch as 'media: samples' (sample:true in index.json, never listed on
      # the site), then the deploy job copies them to Pages. Kinetic only: the capture style records the live product
      # sites and is proven by the CI reel test against the fixture product site instead. The daily agents are skipped.
      - id: samples
        name: Render samples into the media branch (render_sample)
        if: ${{ inputs.render_sample == true }}
        env:
          INPUT_PAGE: ${{ inputs.page }}
        run: |
          if ! git -C .media rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "media branch not configured yet (run scripts/init-media-branch.ps1 once) — nothing to render into"
            exit 1
          fi
          ffmpeg -version | head -n 1
          pages="rishtapatra kaatdo job_rez"
          if [ -n "$INPUT_PAGE" ]; then pages="$INPUT_PAGE"; fi
          for p in $pages; do
            node engine/index.js render-sample --page "$p" --format image
            node engine/index.js render-sample --page "$p" --format reel --style kinetic
          done
          git -C .media config user.name hoshlab-bot
          git -C .media config user.email hoshlab-bot@users.noreply.github.com
          git -C .media add -- media index.json
          if git -C .media diff --cached --quiet; then
            echo "media: samples unchanged (nothing to commit)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -C .media commit --quiet -m "media: samples"
            git -C .media push origin HEAD:refs/heads/media
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: engine
        name: Run the engine
        if: ${{ inputs.render_sample != true }}
        env:
          CI: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_TOKEN_RISHTAPATRA: ${{ secrets.IG_TOKEN_RISHTAPATRA }}
          IG_TOKEN_KAATDO: ${{ secrets.IG_TOKEN_KAATDO }}
          IG_TOKEN_JOB_REZ: ${{ secrets.IG_TOKEN_JOB_REZ }}
          # N16: an empty MOCK_LLM means real providers; '1' only when the dispatch asked for it.
          MOCK_LLM: ${{ inputs.mock_llm == true && '1' || '' }}
          INPUT_AGENTS: ${{ inputs.agents }}
          INPUT_PAGE: ${{ inputs.page }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        # Build the argument list so empty inputs add nothing; --dry-run runs on a temp copy and commits nothing.
        run: |
          args=(daily --commit)
          if [ -n "$INPUT_AGENTS" ]; then args+=(--agents "$INPUT_AGENTS"); fi
          if [ -n "$INPUT_PAGE" ]; then args+=(--page "$INPUT_PAGE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          echo "node engine/index.js ${args[*]}  (MOCK_LLM='${MOCK_LLM}')"
          node engine/index.js "${args[@]}"

  # N17: the caller holds the `pages` group so this deploy and a push-triggered pages.yml never overlap;
  # pages.yml itself uses a per-run group when called (see its comment).
  deploy:
    needs: engine
    if: needs.engine.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    uses: ./.github/workflows/pages.yml
