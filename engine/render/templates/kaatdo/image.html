<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KaatDo · image 1080×1350</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<!-- KaatDo image (design §10, mock/posts.html .post-kd): flat dark console palette (no glow, no shadow),
     brand row (mark · KAATDO ╱ काट दो), optional mono eyebrow, headline, subline, 2–3 mono fact rows,
     footer domain · handle. Devanagari only in Noto Sans Devanagari (review N12). Tokens: company/brands/kaatdo.md -->
<div id="canvas" class="post post-kd" data-palette="dark console palette">
  <div class="brand-row">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <path d="M8 42 L19 30 L27 36 L36 24" fill="none" stroke="#3dff8c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M41 35 H56" fill="none" stroke="#5a6890" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M47 10 L29 54" fill="none" stroke="#ff3b4e" stroke-width="5.5" stroke-linecap="round"/>
    </svg>
    <span class="word"><span id="word-a"></span><b id="word-b"></b></span>
    <span class="slash" id="slash" aria-hidden="true">╱</span>
    <span class="word-hi" lang="hi" id="word-hi"></span>
  </div>
  <p class="eyebrow" id="eyebrow" hidden></p>
  <h2 class="headline" id="headline"></h2>
  <p class="sub" id="sub"></p>
  <ul class="facts" id="facts"></ul>
  <div class="foot"><span id="foot-left"></span><span class="ig-handle" id="foot-right"></span></div>
</div>
<script src="../common.js"></script>
<script>
(function () {
  var H = window.HOSHLAB;
  var draft = window.__DRAFT__ || {};
  var brand = window.__BRAND__ || {};
  var art = draft.artwork || {};
  var canvas = document.getElementById("canvas");
  H.applyTokens(canvas, window.__TOKENS__);
  var up = String(brand.name || "").toUpperCase();
  var cut = up.lastIndexOf("DO");
  document.getElementById("word-a").textContent = cut > 0 ? up.slice(0, cut) : up;
  document.getElementById("word-b").textContent = cut > 0 ? up.slice(cut) : "";
  var wordHi = document.getElementById("word-hi");
  if (brand.nameDevanagari) wordHi.textContent = brand.nameDevanagari;
  else { wordHi.hidden = true; document.getElementById("slash").hidden = true; }
  var eyebrow = document.getElementById("eyebrow");
  if (art.eyebrow) { eyebrow.hidden = false; H.setText(eyebrow, art.eyebrow); }
  var headline = document.getElementById("headline");
  headline.setAttribute("data-variant", H.pickVariant(art.headline));
  H.setText(headline, art.headline || "");
  var sub = document.getElementById("sub");
  if (art.subline) H.setText(sub, art.subline); else sub.hidden = true;
  H.fillList(document.getElementById("facts"), art.facts);
  H.setText(document.getElementById("foot-left"), art.footer || H.siteHost(brand.site));
  document.getElementById("foot-right").textContent = brand.handle ? "@" + brand.handle : "";
})();
</script>
</body>
</html>
