<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KaatDo · carousel slide 1080×1350</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<!-- KaatDo carousel (design §10, brand ## Formats): cover + recap on the dark console palette, body slides on
     the light palette (light-bg / light-txt / light-dim) — the brand's alternative for body slides — unless the
     owner's feedback tagged palette prefers `dark` (window.__PREFER__, FEAT-205 / plan D23), when every slide stays
     on the console palette. window.__SLIDE__ is the 0-based slide index. -->
<div id="canvas" class="post post-kd" data-palette="dark console palette" data-palette-kind="dark">
  <div class="brand-row">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <path d="M8 42 L19 30 L27 36 L36 24" fill="none" stroke="#3dff8c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M41 35 H56" fill="none" stroke="#5a6890" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M47 10 L29 54" fill="none" stroke="#ff3b4e" stroke-width="5.5" stroke-linecap="round"/>
    </svg>
    <span class="word"><span id="word-a"></span><b id="word-b"></b></span>
    <span class="slash" id="slash" aria-hidden="true">╱</span>
    <span class="word-hi" lang="hi" id="word-hi"></span>
  </div>
  <h2 class="headline" id="headline"></h2>
  <p class="sub" id="sub" hidden></p>
  <p class="body" id="body" hidden></p>
  <div class="swipe" id="swipe" hidden><span>Swipe</span><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M8 24h30M26 12l12 12-12 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="dots" id="dots" hidden aria-hidden="true"></div>
  <div class="foot" id="foot" hidden><span id="foot-left"></span><span class="ig-handle" id="foot-right"></span></div>
</div>
<script src="../common.js"></script>
<script>
(function () {
  var H = window.HOSHLAB;
  var draft = window.__DRAFT__ || {};
  var brand = window.__BRAND__ || {};
  var slides = Array.isArray(draft.slides) ? draft.slides : [];
  var i = Math.max(0, Math.min(slides.length - 1, Number(window.__SLIDE__ || 0)));
  var slide = slides[i] || {};
  var role = i === 0 ? "cover" : i === slides.length - 1 ? "recap" : "body";
  var canvas = document.getElementById("canvas");
  canvas.classList.add("slide-" + role);
  if (role === "body" && H.preferredPalette() !== "dark") {
    canvas.classList.add("light");
    canvas.setAttribute("data-palette", "light palette");
    canvas.setAttribute("data-palette-kind", "light");
  }
  H.applyTokens(canvas, window.__TOKENS__);
  var up = String(brand.name || "").toUpperCase();
  var cut = up.lastIndexOf("DO");
  document.getElementById("word-a").textContent = cut > 0 ? up.slice(0, cut) : up;
  document.getElementById("word-b").textContent = cut > 0 ? up.slice(cut) : "";
  var wordHi = document.getElementById("word-hi");
  if (brand.nameDevanagari) wordHi.textContent = brand.nameDevanagari;
  else { wordHi.hidden = true; document.getElementById("slash").hidden = true; }
  var headline = document.getElementById("headline");
  headline.setAttribute("data-variant", H.pickVariant(slide.heading));
  H.setText(headline, slide.heading || "");
  if (role === "cover") {
    var sub = document.getElementById("sub");
    sub.hidden = false;
    H.setText(sub, slide.body || "");
    document.getElementById("swipe").hidden = false;
  } else {
    var body = document.getElementById("body");
    body.hidden = false;
    H.setText(body, slide.body || "");
    if (role === "body") {
      var dots = document.getElementById("dots");
      dots.hidden = false;
      H.fillDots(dots, slides.length, i);
    } else {
      document.getElementById("foot").hidden = false;
      document.getElementById("foot-left").textContent = H.siteHost(brand.site);
      document.getElementById("foot-right").textContent = brand.handle ? "@" + brand.handle : "";
    }
  }
})();
</script>
</body>
</html>
