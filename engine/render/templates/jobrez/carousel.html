<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobRez · carousel slide 1080×1350</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<!-- JobRez carousel (design §10, brand ## Formats): cover on ink with cream display type and the gradient tile,
     body slides on canvas with ink headings, recap slide with footer. window.__SLIDE__ is the 0-based slide index. -->
<div id="canvas" class="post post-jr" data-palette="violet on cream" data-palette-kind="light">
  <div class="brand-row">
    <span class="tile" data-bg="#9247f2" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <path d="M7 6.5 h9.5 l5 5 V24 a2 2 0 0 1 -2 2 H7 a2 2 0 0 1 -2 -2 V8.5 a2 2 0 0 1 2 -2 z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M16.5 6.5 V11.5 h5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M9.5 16 h7.5 M9.5 20 h5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
        <circle cx="23.5" cy="23.5" r="6.5" fill="#22c55e"/>
        <path d="M20.6 23.6 l2 2 l3.9 -4.2" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="word"><span id="word-a"></span><span id="word-b"></span></span>
  </div>
  <h2 class="headline" id="headline"></h2>
  <p class="sub" id="sub" hidden></p>
  <p class="body" id="body" hidden></p>
  <div class="swipe" id="swipe" hidden><span>Swipe</span><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M8 24h30M26 12l12 12-12 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="dots" id="dots" hidden aria-hidden="true"></div>
  <div class="foot" id="foot" hidden><span id="foot-left"></span><span class="ig-handle" id="foot-right"></span></div>
</div>
<script src="../common.js"></script>
<script>
(function () {
  var H = window.HOSHLAB;
  var draft = window.__DRAFT__ || {};
  var brand = window.__BRAND__ || {};
  var slides = Array.isArray(draft.slides) ? draft.slides : [];
  var i = Math.max(0, Math.min(slides.length - 1, Number(window.__SLIDE__ || 0)));
  var slide = slides[i] || {};
  var role = i === 0 ? "cover" : i === slides.length - 1 ? "recap" : "body";
  var canvas = document.getElementById("canvas");
  canvas.classList.add("slide-" + role);
  if (role === "cover") { canvas.setAttribute("data-palette", "cream on ink"); canvas.setAttribute("data-palette-kind", "dark"); }
  H.applyTokens(canvas, window.__TOKENS__);
  var name = String(brand.name || "");
  var m = /^([A-Z][a-z]+)([A-Z].*)$/.exec(name);
  document.getElementById("word-a").textContent = m ? m[1] : name;
  document.getElementById("word-b").textContent = m ? m[2] : "";
  var headline = document.getElementById("headline");
  var text = slide.heading || "";
  headline.setAttribute("data-variant", H.pickVariant(text));
  var parts = /^(.*?[.!?])\s+(\S.*)$/.exec(text);
  if (parts) {
    H.setText(headline, parts[1] + " ");
    var em = document.createElement("em");
    H.setText(em, parts[2]);
    headline.appendChild(em);
  } else H.setText(headline, text);
  if (role === "cover") {
    var sub = document.getElementById("sub");
    sub.hidden = false;
    H.setText(sub, slide.body || "");
    document.getElementById("swipe").hidden = false;
  } else {
    var body = document.getElementById("body");
    body.hidden = false;
    H.setText(body, slide.body || "");
    if (role === "body") {
      var dots = document.getElementById("dots");
      dots.hidden = false;
      H.fillDots(dots, slides.length, i);
    } else {
      document.getElementById("foot").hidden = false;
      document.getElementById("foot-left").textContent = H.siteHost(brand.site);
      document.getElementById("foot-right").textContent = brand.handle ? "@" + brand.handle : "";
    }
  }
})();
</script>
</body>
</html>
